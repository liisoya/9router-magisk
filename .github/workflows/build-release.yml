name: Build & Release 9Router Module

# 触发方式：
#  1) 推送 v* 标签 → 构建 + 创建/更新对应 Release，并把刷新后的 update.json 同步回 main
#  2) 手动 workflow_dispatch → 只构建并上传 artifact（不建 Release）
# 版本号来自 versions.env（APP_VERSION + MODULE_REV），打标签前先改它。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build module zip
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils xz-utils python3 zip curl openssl dpkg

      - name: Fetch Android runtime (Termux official packages)
        run: bash tools/fetch-runtime.sh

      - name: Fetch upstream prebuilt app (npm)
        run: bash tools/fetch-app.sh

      - name: Assemble module zip
        run: bash tools/build-module.sh

      - name: Show artifact info
        run: |
          ls -lh dist/*.zip
          cat update.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9router-module-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

      - name: Sync update.json back to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json 无变化，跳过"
          else
            git commit -m "chore(release): sync update.json for ${{ github.ref_name }}"
            git push origin HEAD:main
          fi
